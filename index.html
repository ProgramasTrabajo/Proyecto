<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE STATUS - CONTROL DE PROCESOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-24">

    <div id="app">
        <!-- Barra de Navegación -->
        <header class="bg-white/90 backdrop-blur-md border-b sticky top-0 z-40 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div class="bg-blue-600 p-2.5 rounded-2xl text-white shadow-lg shadow-blue-200">
                        <i data-lucide="layout-dashboard" size="26"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-black text-slate-900 tracking-tighter uppercase">Status de Pendientes</h1>
                        <div id="connectionIndicator" class="flex items-center gap-2">
                            <span class="w-2 h-2 bg-yellow-500 rounded-full animate-pulse"></span>
                            <p id="connectionText" class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Cargando sistema...</p>
                        </div>
                    </div>
                </div>
                
                <div class="flex items-center gap-3">
                    <div class="relative flex-1 md:w-80">
                        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" size="16"></i>
                        <input 
                            type="text" 
                            id="searchBar"
                            placeholder="BUSCAR TAREA O RESPONSABLE..."
                            class="w-full pl-11 pr-4 py-3 bg-slate-100 border-none rounded-2xl text-xs font-bold focus:ring-2 focus:ring-blue-500 transition-all uppercase placeholder:text-slate-400"
                        >
                    </div>
                    <button 
                        id="toggleAddBtn"
                        class="p-3 bg-slate-900 text-white rounded-2xl transition-all shadow-lg hover:scale-105 active:scale-95"
                    >
                        <i data-lucide="plus" id="addIcon" size="24"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 mt-8">
            <!-- Indicadores -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Total</p>
                    <p id="totalCount" class="text-2xl font-black text-slate-800">0</p>
                </div>
                <div class="bg-yellow-50 p-6 rounded-3xl border border-yellow-100 shadow-sm">
                    <p class="text-[10px] font-black text-yellow-600 uppercase tracking-widest mb-1">Pendientes</p>
                    <p id="pendingCount" class="text-2xl font-black text-yellow-700">0</p>
                </div>
                <div class="bg-blue-50 p-6 rounded-3xl border border-blue-100 shadow-sm">
                    <p class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-1">En Proceso</p>
                    <p id="processCount" class="text-2xl font-black text-blue-700">0</p>
                </div>
                <div class="bg-green-50 p-6 rounded-3xl border border-green-100 shadow-sm">
                    <p class="text-[10px] font-black text-green-600 uppercase tracking-widest mb-1">Completados</p>
                    <p id="completedCount" class="text-2xl font-black text-green-700">0</p>
                </div>
            </div>

            <!-- Formulario -->
            <div id="addFormContainer" class="hidden bg-white rounded-[2.5rem] p-8 shadow-2xl border border-slate-100 mb-10 animate-in slide-in-from-top-6 duration-500">
                <form id="taskForm" class="space-y-6">
                    <div class="grid md:grid-cols-12 gap-6">
                        <div class="md:col-span-4 space-y-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Responsable</label>
                            <input type="text" id="respInput" placeholder="EJ: BUK, HONDA..." class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-xs font-bold uppercase outline-none focus:border-blue-500">
                        </div>
                        <div class="md:col-span-8 space-y-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Tarea</label>
                            <div class="flex gap-3">
                                <input type="text" id="procInput" placeholder="DESCRIPCIÓN..." class="flex-1 p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-xs font-bold uppercase outline-none focus:border-blue-500">
                                <button type="submit" class="bg-blue-600 text-white px-8 rounded-2xl font-black text-xs uppercase">GUARDAR</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Filtros -->
            <div id="filterContainer" class="flex items-center gap-3 mb-8 overflow-x-auto pb-4 scrollbar-hide"></div>

            <!-- Tabla -->
            <div class="bg-white rounded-[2.5rem] shadow-xl border border-slate-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full border-collapse">
                        <thead>
                            <tr class="bg-slate-50/50 border-b border-slate-100 text-[10px] font-black text-slate-400 uppercase tracking-widest text-left">
                                <th class="px-8 py-6">Responsable</th>
                                <th class="px-8 py-6">Proceso</th>
                                <th class="px-8 py-6 text-center">Estado</th>
                                <th class="px-8 py-6"></th>
                            </tr>
                        </thead>
                        <tbody id="taskTableBody" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- Modal Anexo 1 -->
        <div id="anexoModal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4 backdrop-blur-md">
            <div class="bg-white rounded-[2rem] w-full max-w-5xl shadow-2xl overflow-hidden border border-slate-200">
                <div class="bg-slate-900 p-6 text-white flex justify-between items-center">
                    <h3 class="font-black uppercase tracking-tight">Anexo 1: Validación de Fechas</h3>
                    <button onclick="document.getElementById('anexoModal').classList.add('hidden')" class="hover:bg-white/10 p-2 rounded-full"><i data-lucide="x"></i></button>
                </div>
                <div class="p-8 overflow-x-auto" id="anexoContent"></div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // DATOS DEL EXCEL (SIEMPRE VISIBLES)
        const INITIAL_SEED = [
            { encargado: 'BUK', proceso: 'INDEMNIZACIÓN DE VACACIONES. BK ESPEJO' },
            { encargado: 'BUK', proceso: 'BLOQUEO DE VACACIONES.' },
            { encargado: 'BUK', proceso: 'PROBAR TXT PAGO.' },
            { encargado: 'BUK', proceso: 'ENSEÑAR COMO SE REGISTRA LOS PRESTAMOS' },
            { encargado: 'HONDA', proceso: 'HISTORICO DE FALTAS( PARA PROCESO DE LIQUIDACIONES' },
            { encargado: 'HONDA', proceso: 'ACTUALIZACIÓN DE LOS DATOS AFP(PLATAFORMA AFP NET)' },
            { encargado: 'HONDA', proceso: 'SOLICITAR LOS DOCUMENTOS DE RETENCION JUDICIAL' },
            { encargado: 'ABRAHAM', proceso: 'EL CLIENTE NOS CONFIRMÓ CAMBIAR DE FECHAS DE INGRESO.(VALIDAR FECHA DE INGRESO) ANEXO 1' },
            { encargado: 'ABRAHAM', proceso: 'INGRESAR NOVEDADES DICIEMBRE(ADEMÁS VALIDAR LOS % DE APORTE)' },
            { encargado: 'KATJUSKA', proceso: 'VALIDAR GRATIFICACIONES DICIEMBRE( CÁLCULO, PRESTAMOS, DESCUENTO, ETC)' },
            { encargado: 'KATJUSKA', proceso: 'RECORDATORIO INDICANDO QUE ESTÁ PENDIENTE LA ACTUALIZACIÓN DE LOS DATOS AFP' }
        ];

        const ANEXO_DATA = [
            { emp: "HDP", num: "71395089", nom: "ACOSTA DLOAYZA NICOLAS", rep: "2021-12-17", buk: "2021-12-15" },
            { emp: "HSP", num: "5365524", nom: "DIAZ FLORES ENRIQUE", rep: "2011-10-01", buk: "2002-12-17" },
            { emp: "HSP", num: "43014238", nom: "INFANZON GARCIA HERNAN LUIS", rep: "2010-05-01", buk: "2009-12-14" },
            { emp: "HSP", num: "7751221", nom: "RENGIFO QUISPE CARLOS MARCOS", rep: "2010-05-01", buk: "1991-11-18" },
            { emp: "HSP", num: "44849303", nom: "TUESTA TORRES WILSON JUNIOR", rep: "2014-01-01", buk: "2009-03-02" }
        ];

        let db, auth, tareasCol;
        let tasks = [];
        let filterActive = 'Todos';
        let isOnline = false;
        let config = null;
        let appId = 'status-tracker-v6';

        // 1. Intentar cargar configuración de Firebase
        try {
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                config = JSON.parse(__firebase_config);
                appId = typeof __app_id !== 'undefined' ? __app_id : appId;
            }
        } catch (e) {
            console.warn("Configuración de Firebase no disponible.");
        }

        // 2. Inicialización del Sistema
        async function initSystem() {
            if (config) {
                try {
                    const app = initializeApp(config);
                    db = getFirestore(app);
                    auth = getAuth(app);
                    
                    // REGLA 3: Autenticación ANTES de cualquier consulta
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }

                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            isOnline = true;
                            document.getElementById('connectionText').innerText = "Sincronizado en línea";
                            document.getElementById('connectionIndicator').querySelector('span').classList.replace('bg-yellow-500', 'bg-green-500');
                            
                            // Iniciar escucha de datos
                            startRealtimeSync();
                        }
                    });
                } catch (error) {
                    console.error("Fallo al conectar con Firebase:", error);
                    enableLocalMode();
                }
            } else {
                enableLocalMode();
            }
        }

        function enableLocalMode() {
            isOnline = false;
            document.getElementById('connectionText').innerText = "Modo Local (Sin base de datos)";
            document.getElementById('connectionIndicator').querySelector('span').classList.replace('bg-green-500', 'bg-yellow-500');
            tasks = INITIAL_SEED.map((t, i) => ({ id: 'local-' + i, ...t, status: 'Pendiente', createdAt: new Date().toISOString() }));
            render();
        }

        function startRealtimeSync() {
            if (!auth.currentUser) return;
            
            // REGLA 1: Ruta estricta de Firestore
            tareasCol = collection(db, 'artifacts', appId, 'public', 'data', 'tareas');
            
            onSnapshot(tareasCol, (snapshot) => {
                if (snapshot.empty) {
                    // Inicializar base de datos con semillas si está vacía
                    INITIAL_SEED.forEach(async (t) => {
                        await addDoc(tareasCol, { ...t, status: 'Pendiente', createdAt: new Date().toISOString() });
                    });
                } else {
                    tasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    // REGLA 2: Ordenar en memoria (JavaScript) para evitar requerir índices compuestos en Firebase
                    tasks.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    render();
                }
            }, (error) => {
                console.error("Error de permisos o conexión en Firestore:", error);
                if (error.code === 'permission-denied') {
                    document.getElementById('connectionText').innerText = "Error de Permisos";
                }
            });
        }

        // 3. Funciones de Interfaz
        function render() {
            renderFilters();
            renderTable();
            updateStats();
            lucide.createIcons();
        }

        function renderFilters() {
            const container = document.getElementById('filterContainer');
            const resps = ['Todos', ...new Set(tasks.map(t => t.encargado))].sort();
            container.innerHTML = `<div class="flex items-center gap-2 text-slate-400 mr-2 border-r pr-4 border-slate-200 shrink-0"><i data-lucide="filter" size="14"></i><span class="text-[9px] font-black uppercase">Filtrar:</span></div>`;
            resps.forEach(r => {
                const btn = document.createElement('button');
                btn.className = `px-5 py-2.5 rounded-2xl text-[10px] font-black tracking-widest border-2 transition-all ${filterActive === r ? 'bg-slate-900 border-slate-900 text-white shadow-lg' : 'bg-white border-slate-100 text-slate-400'}`;
                btn.innerText = r.toUpperCase();
                btn.onclick = () => { filterActive = r; render(); };
                container.appendChild(btn);
            });
        }

        function renderTable() {
            const body = document.getElementById('taskTableBody');
            const search = document.getElementById('searchBar').value.toUpperCase();
            const filtered = tasks.filter(t => (filterActive === 'Todos' || t.encargado === filterActive) && (t.proceso.toUpperCase().includes(search) || t.encargado.includes(search)));

            if (filtered.length === 0) {
                body.innerHTML = `<tr><td colspan="4" class="px-8 py-10 text-center text-slate-400 font-bold uppercase tracking-widest">No hay tareas encontradas</td></tr>`;
                return;
            }

            body.innerHTML = filtered.map(t => `
                <tr class="hover:bg-slate-50 group transition-colors">
                    <td class="px-8 py-6 font-black text-slate-800 text-xs">${t.encargado}</td>
                    <td class="px-8 py-6">
                        <p class="text-xs font-bold text-slate-600 uppercase leading-relaxed max-w-2xl">${t.proceso}</p>
                        ${t.proceso.includes('ANEXO 1') ? `<button onclick="window.showAnexo()" class="mt-2 flex items-center gap-2 text-[9px] font-black text-blue-600 bg-blue-50 px-3 py-1.5 rounded-xl border border-blue-100 hover:bg-blue-600 hover:text-white transition-all w-fit"><i data-lucide="file-text" size="12"></i> VER ANEXO 1</button>` : ''}
                    </td>
                    <td class="px-8 py-6">
                        <div class="flex justify-center relative group/menu">
                            <button class="px-4 py-2 rounded-2xl text-[10px] font-black border-2 shadow-sm ${getStatusStyle(t.status)}">${t.status.toUpperCase()}</button>
                            <div class="absolute left-1/2 -translate-x-1/2 mt-2 hidden group-hover/menu:block z-30 bg-white border rounded-2xl shadow-2xl p-2 min-w-[140px] animate-in fade-in zoom-in-95 duration-100">
                                ${['Pendiente', 'En Proceso', 'Completado'].map(st => `<button onclick="window.updateStatus('${t.id}', '${st}')" class="w-full text-left px-4 py-2 text-[10px] hover:bg-slate-50 rounded-xl font-black uppercase text-slate-500 hover:text-blue-600 transition-colors">${st}</button>`).join('')}
                            </div>
                        </div>
                    </td>
                    <td class="px-8 py-6 text-right">
                        <button onclick="window.deleteTask('${t.id}')" class="p-2 text-slate-200 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all rounded-lg hover:bg-red-50"><i data-lucide="trash-2" size="18"></i></button>
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        function updateStats() {
            document.getElementById('totalCount').innerText = tasks.length;
            document.getElementById('pendingCount').innerText = tasks.filter(t => t.status === 'Pendiente').length;
            document.getElementById('processCount').innerText = tasks.filter(t => t.status === 'En Proceso').length;
            document.getElementById('completedCount').innerText = tasks.filter(t => t.status === 'Completado').length;
        }

        function getStatusStyle(s) {
            if (s === 'Pendiente') return 'bg-yellow-50 text-yellow-700 border-yellow-200';
            if (s === 'En Proceso') return 'bg-blue-50 text-blue-700 border-blue-200';
            return 'bg-green-50 text-green-700 border-green-200';
        }

        // 4. Acciones Globales
        window.updateStatus = async (id, status) => {
            if (isOnline && auth.currentUser) {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tareas', id);
                await updateDoc(docRef, { status });
            } else {
                tasks = tasks.map(t => t.id == id ? {...t, status} : t);
                render();
            }
        };

        window.deleteTask = async (id) => {
            if (!confirm("¿ELIMINAR TAREA PARA TODO EL EQUIPO?")) return;
            if (isOnline && auth.currentUser) {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tareas', id);
                await deleteDoc(docRef);
            } else {
                tasks = tasks.filter(t => t.id != id);
                render();
            }
        };

        window.showAnexo = () => {
            const content = document.getElementById('anexoContent');
            content.innerHTML = `
                <table class="w-full text-xs">
                    <thead>
                        <tr class="border-b-2 text-slate-400 font-black uppercase tracking-widest">
                            <th class="px-4 py-4 text-left">Empresa</th>
                            <th class="px-4 py-4 text-left">Número</th>
                            <th class="px-4 py-4 text-left">Nombre Completo</th>
                            <th class="px-4 py-4 text-blue-600 bg-blue-50/50">Reporte 31/10</th>
                            <th class="px-4 py-4 text-green-600 bg-green-50/50">Fecha BUK</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-50">
                        ${ANEXO_DATA.map(r => `
                            <tr class="hover:bg-slate-50 transition-colors">
                                <td class="px-4 py-4 font-black">${r.emp}</td>
                                <td class="px-4 py-4 text-slate-500 font-bold">${r.num}</td>
                                <td class="px-4 py-4 font-black uppercase text-slate-700">${r.nom}</td>
                                <td class="px-4 py-4 text-blue-700 bg-blue-50/20 font-black">${r.rep}</td>
                                <td class="px-4 py-4 text-green-700 bg-green-50/20 font-black">${r.buk}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;
            document.getElementById('anexoModal').classList.remove('hidden');
            lucide.createIcons();
        };

        document.getElementById('taskForm').onsubmit = async (e) => {
            e.preventDefault();
            const resp = document.getElementById('respInput').value.trim().toUpperCase();
            const proc = document.getElementById('procInput').value.trim().toUpperCase();
            if (!resp || !proc) return;
            
            if (isOnline && auth.currentUser) {
                await addDoc(tareasCol, { 
                    encargado: resp, 
                    proceso: proc, 
                    status: 'Pendiente', 
                    createdAt: new Date().toISOString() 
                });
            } else {
                tasks.unshift({ 
                    id: 'local-' + Date.now(), 
                    encargado: resp, 
                    proceso: proc, 
                    status: 'Pendiente', 
                    createdAt: new Date().toISOString() 
                });
                render();
            }
            document.getElementById('procInput').value = '';
        };

        document.getElementById('searchBar').oninput = render;
        document.getElementById('toggleAddBtn').onclick = () => {
            const cont = document.getElementById('addFormContainer');
            cont.classList.toggle('hidden');
            document.getElementById('addIcon').setAttribute('data-lucide', cont.classList.contains('hidden') ? 'plus' : 'x');
            lucide.createIcons();
        };

        // Iniciar el sistema al cargar
        initSystem();
    </script>
</body>
</html>
