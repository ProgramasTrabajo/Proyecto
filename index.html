<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STATUS EQUIPO - CONTROL ONLINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-20">

    <div id="app">
        <!-- Header -->
        <header class="bg-white/80 backdrop-blur-md border-b sticky top-0 z-40 shadow-sm">
            <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div class="bg-blue-600 p-2.5 rounded-2xl text-white shadow-lg shadow-blue-200">
                        <i data-lucide="clipboard-list" size="26"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-black text-slate-900 tracking-tighter">STATUS EQUIPO</h1>
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                            <p class="text-[10px] text-slate-500 uppercase tracking-widest font-black">Sincronizado en tiempo real</p>
                        </div>
                    </div>
                </div>
                
                <div class="flex items-center gap-3">
                    <div class="relative flex-1 md:w-72">
                        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" size="16"></i>
                        <input 
                            type="text" 
                            id="searchBar"
                            placeholder="BUSCAR PROCESO..."
                            class="w-full pl-11 pr-4 py-3 bg-slate-100 border-none rounded-2xl text-xs font-black focus:ring-2 focus:ring-blue-500 transition-all uppercase placeholder:text-slate-400"
                        >
                    </div>
                    <button 
                        id="toggleAddBtn"
                        class="p-3 bg-blue-600 text-white rounded-2xl transition-all shadow-lg shadow-blue-200 hover:bg-blue-700"
                    >
                        <i data-lucide="plus" id="addIcon" size="24"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-6xl mx-auto px-4 mt-8">
            <!-- Formulario de nueva tarea -->
            <div id="addFormContainer" class="hidden bg-white rounded-3xl p-8 shadow-xl border border-slate-100 mb-10 animate-in slide-in-from-top-6 duration-500">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-sm font-black uppercase tracking-[0.2em] text-blue-600">Agregar Nuevos Procesos</h2>
                </div>
                <form id="taskForm" class="space-y-6">
                    <div class="grid md:grid-cols-12 gap-6">
                        <div class="md:col-span-4 space-y-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Responsable</label>
                            <input 
                                type="text" 
                                id="respInput"
                                placeholder="EJ: BUK, HONDA..."
                                class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-xs font-black uppercase outline-none focus:border-blue-500 transition-all"
                                required
                            >
                        </div>
                        <div class="md:col-span-8 space-y-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Descripción de la Tarea</label>
                            <div class="flex gap-3">
                                <input 
                                    type="text" 
                                    id="procInput"
                                    placeholder="INGRESE EL PENDIENTE..."
                                    class="flex-1 p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-xs font-black uppercase outline-none focus:border-blue-500 transition-all"
                                    required
                                >
                                <button type="submit" class="bg-blue-600 text-white px-8 rounded-2xl font-black text-xs uppercase hover:bg-blue-700 shadow-lg flex items-center gap-2">
                                    <i data-lucide="send" size="16"></i> GUARDAR
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Filtros -->
            <div id="filterContainer" class="flex items-center gap-3 mb-8 overflow-x-auto pb-4 scrollbar-hide">
                <!-- Se genera dinámicamente -->
            </div>

            <!-- Listado Principal -->
            <div class="bg-white rounded-[2rem] shadow-xl border border-slate-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full border-collapse">
                        <thead>
                            <tr class="bg-slate-50/50 border-b border-slate-100">
                                <th class="px-8 py-6 text-[10px] font-black text-slate-400 uppercase tracking-widest text-left">Responsable</th>
                                <th class="px-8 py-6 text-[10px] font-black text-slate-400 uppercase tracking-widest text-left">Proceso</th>
                                <th class="px-8 py-6 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Estado</th>
                                <th class="px-8 py-6"></th>
                            </tr>
                        </thead>
                        <tbody id="taskTableBody" class="divide-y divide-slate-50">
                            <!-- Se genera dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- Modal Anexo 1 -->
        <div id="anexoModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-3xl w-full max-w-4xl shadow-2xl overflow-hidden border border-slate-200">
                <div class="bg-slate-900 p-5 text-white flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <i data-lucide="file-text" size="20" class="text-blue-400"></i>
                        <h3 class="font-black tracking-tight uppercase">Anexo 1: Validación de Fechas</h3>
                    </div>
                    <button onclick="document.getElementById('anexoModal').classList.add('hidden')" class="hover:bg-white/10 p-2 rounded-full"><i data-lucide="x"></i></button>
                </div>
                <div class="p-8 overflow-x-auto" id="anexoContent">
                    <!-- Tabla del anexo -->
                </div>
            </div>
        </div>

        <footer class="fixed bottom-0 left-0 right-0 bg-white border-t py-4 z-40">
            <div class="max-w-6xl mx-auto px-4 flex justify-between items-center">
                <p id="statsCounter" class="text-[10px] font-black text-slate-400 tracking-widest uppercase">Cargando datos...</p>
                <p class="text-[10px] font-black text-slate-300 tracking-widest uppercase hidden md:block">Sistema Colaborativo HTML v3.0</p>
            </div>
        </footer>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Configuración proporcionada por el entorno
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'status-tracker-html';

        let currentTasks = [];
        let filterActive = 'Todos';
        let currentUser = null;

        const ANEXO_1_DATA = [
            { empresa: "HDP", numero: "71395089", nombre: "ACOSTA DLOAYZA NICOLAS", fechaReporte: "2021-12-17", fechaBuk: "2021-12-15" },
            { empresa: "HSP", numero: "5365524", nombre: "DIAZ FLORES ENRIQUE", fechaReporte: "2011-10-01", fechaBuk: "2002-12-17" },
            { empresa: "HSP", numero: "43014238", nombre: "INFANZON GARCIA HERNAN LUIS", fechaReporte: "2010-05-01", fechaBuk: "2009-12-14" },
            { empresa: "HSP", numero: "7751221", nombre: "RENGIFO QUISPE CARLOS MARCOS", fechaReporte: "2010-05-01", fechaBuk: "1991-11-18" },
            { empresa: "HSP", numero: "44849303", nombre: "TUESTA TORRES WILSON JUNIOR", fechaReporte: "2014-01-01", fechaBuk: "2009-03-02" }
        ];

        // LISTA COMPLETA CARGADA DESDE EL EXCEL (MAYÚSCULAS)
        const INITIAL_SEED = [
            // BUK
            { encargado: 'BUK', proceso: 'INDEMNIZACIÓN DE VACACIONES. BK ESPEJO', status: 'Pendiente' },
            { encargado: 'BUK', proceso: 'BLOQUEO DE VACACIONES.', status: 'Pendiente' },
            { encargado: 'BUK', proceso: 'PROBAR TXT PAGO.', status: 'Pendiente' },
            { encargado: 'BUK', proceso: 'ENSEÑAR COMO SE REGISTRA LOS PRESTAMOS', status: 'Pendiente' },
            // HONDA
            { encargado: 'HONDA', proceso: 'HISTORICO DE FALTAS (PARA PROCESO DE LIQUIDACIONES)', status: 'Pendiente' },
            { encargado: 'HONDA', proceso: 'ACTUALIZACIÓN DE LOS DATOS AFP (PLATAFORMA AFP NET)', status: 'Pendiente' },
            { encargado: 'HONDA', proceso: 'SOLICITAR LOS DOCUMENTOS DE RETENCION JUDICIAL', status: 'Pendiente' },
            // ABRAHAM
            { encargado: 'ABRAHAM', proceso: 'EL CLIENTE NOS CONFIRMÓ CAMBIAR DE FECHAS DE INGRESO (VALIDAR FECHA DE INGRESO) ANEXO 1', status: 'Pendiente' },
            { encargado: 'ABRAHAM', proceso: 'INGRESAR NOVEDADES DICIEMBRE (ADEMÁS VALIDAR LOS % DE APORTE)', status: 'Pendiente' },
            // KATJUSKA
            { encargado: 'KATJUSKA', proceso: 'VALIDAR GRATIFICACIONES DICIEMBRE (CÁLCULO, PRESTAMOS, DESCUENTO, ETC)', status: 'Pendiente' },
            { encargado: 'KATJUSKA', proceso: 'RECORDATORIO INDICANDO QUE ESTÁ PENDIENTE LA ACTUALIZACIÓN DE LOS DATOS AFP', status: 'Pendiente' }
        ];

        // Autenticación
        async function init() {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) startSync();
            });
        }

        // Sincronización Real-time
        function startSync() {
            const tareasCol = collection(db, 'artifacts', appId, 'public', 'data', 'tareas');
            onSnapshot(tareasCol, (snapshot) => {
                const tasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if (tasks.length === 0) {
                    INITIAL_SEED.forEach(t => addDoc(tareasCol, { 
                        encargado: t.encargado.toUpperCase(),
                        proceso: t.proceso.toUpperCase(),
                        status: t.status,
                        createdAt: new Date().toISOString() 
                    }));
                } else {
                    currentTasks = tasks.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
                    renderAll();
                }
            });
        }

        // Renderizado
        function renderAll() {
            renderFilters();
            renderTasks();
            renderStats();
            lucide.createIcons();
        }

        function renderFilters() {
            const container = document.getElementById('filterContainer');
            const responsables = ['Todos', ...new Set(currentTasks.map(t => t.encargado))].sort();
            
            container.innerHTML = `<div class="flex items-center gap-2 text-slate-400 mr-2 border-r pr-4 border-slate-200 shrink-0">
                <i data-lucide="filter" size="16"></i><span class="text-[10px] font-black uppercase tracking-widest">Filtrar:</span>
            </div>`;

            responsables.forEach(r => {
                const btn = document.createElement('button');
                btn.className = `px-5 py-2.5 rounded-2xl text-[10px] font-black tracking-widest transition-all shrink-0 border-2 ${filterActive === r ? 'bg-slate-900 border-slate-900 text-white shadow-lg' : 'bg-white border-slate-100 text-slate-400 hover:border-slate-300'}`;
                btn.innerText = r.toUpperCase();
                btn.onclick = () => { filterActive = r; renderAll(); };
                container.appendChild(btn);
            });
        }

        function renderTasks() {
            const body = document.getElementById('taskTableBody');
            const search = document.getElementById('searchBar').value.toUpperCase();
            
            const filtered = currentTasks.filter(t => {
                const matchesFilter = filterActive === 'Todos' || t.encargado === filterActive;
                const matchesSearch = t.proceso.includes(search) || t.encargado.includes(search);
                return matchesFilter && matchesSearch;
            });

            body.innerHTML = filtered.map(t => `
                <tr class="hover:bg-slate-50 group">
                    <td class="px-8 py-6 font-black text-slate-800 text-xs">${t.encargado}</td>
                    <td class="px-8 py-6">
                        <p class="text-xs font-black text-slate-600 uppercase tracking-tight">${t.proceso}</p>
                        ${t.proceso.includes('ANEXO 1') ? `<button onclick="window.showAnexo()" class="mt-2 flex items-center gap-2 text-[9px] font-black text-blue-600 bg-blue-50 px-3 py-1.5 rounded-xl border border-blue-100 transition-all hover:bg-blue-600 hover:text-white"><i data-lucide="file-text" size="12"></i> VER ANEXO 1</button>` : ''}
                    </td>
                    <td class="px-8 py-6">
                        <div class="flex justify-center relative group/status">
                            <button class="status-btn px-4 py-2 rounded-2xl text-[10px] font-black border-2 transition-all ${getStatusStyle(t.status)}">
                                ${t.status.toUpperCase()}
                            </button>
                            <div class="absolute left-1/2 -translate-x-1/2 mt-2 hidden group-hover/status:block z-30 bg-white border border-slate-200 rounded-2xl shadow-2xl p-2 min-w-[140px]">
                                ${['Pendiente', 'En Proceso', 'Completado'].map(st => `
                                    <button onclick="window.updateStatus('${t.id}', '${st}')" class="w-full text-left px-4 py-2 text-[10px] hover:bg-slate-50 rounded-xl font-black uppercase text-slate-500">${st}</button>
                                `).join('')}
                            </div>
                        </div>
                    </td>
                    <td class="px-8 py-6 text-right">
                        <button onclick="window.deleteTask('${t.id}')" class="text-slate-200 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all"><i data-lucide="trash-2" size="18"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function renderStats() {
            const total = currentTasks.length;
            const pendientes = currentTasks.filter(t => t.status === 'Pendiente').length;
            document.getElementById('statsCounter').innerText = `TOTAL: ${total} PROCESOS | PENDIENTES: ${pendientes}`;
        }

        function getStatusStyle(s) {
            if (s === 'Pendiente') return 'bg-yellow-100 text-yellow-800 border-yellow-200';
            if (s === 'En Proceso') return 'bg-blue-100 text-blue-800 border-blue-200';
            return 'bg-green-100 text-green-800 border-green-200';
        }

        // Acciones Globales
        window.updateStatus = async (id, status) => {
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'tareas', id);
            await updateDoc(ref, { status });
        };

        window.deleteTask = async (id) => {
            if (confirm("¿ELIMINAR TAREA?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tareas', id));
            }
        };

        window.showAnexo = () => {
            const modal = document.getElementById('anexoModal');
            const content = document.getElementById('anexoContent');
            content.innerHTML = `
                <table class="w-full text-xs">
                    <thead><tr class="border-b-2 border-slate-100 text-slate-400 font-black uppercase tracking-widest">
                        <th class="px-4 py-3 text-left">Empresa</th><th class="px-4 py-3 text-left">Número</th><th class="px-4 py-3 text-left">Nombre Completo</th>
                        <th class="px-4 py-3 text-left text-blue-600 bg-blue-50/50">Fecha Reporte</th><th class="px-4 py-3 text-left text-green-600 bg-green-50/50">Fecha BUK</th>
                    </tr></thead>
                    <tbody class="divide-y divide-slate-50">${ANEXO_1_DATA.map(r => `
                        <tr><td class="px-4 py-4 font-black">${r.empresa}</td><td class="px-4 py-4 text-slate-500 font-bold">${r.numero}</td>
                        <td class="px-4 py-4 font-black uppercase">${r.nombre}</td><td class="px-4 py-4 text-blue-700 bg-blue-50/20 font-black">${r.fechaReporte}</td>
                        <td class="px-4 py-4 text-green-700 bg-green-50/20 font-black">${r.fechaBuk}</td></tr>`).join('')}
                    </tbody>
                </table>`;
            modal.classList.remove('hidden');
            lucide.createIcons();
        };

        // Eventos UI
        document.getElementById('toggleAddBtn').onclick = () => {
            const container = document.getElementById('addFormContainer');
            const isHidden = container.classList.contains('hidden');
            container.classList.toggle('hidden');
            document.getElementById('addIcon').setAttribute('data-lucide', isHidden ? 'x' : 'plus');
            lucide.createIcons();
        };

        document.getElementById('taskForm').onsubmit = async (e) => {
            e.preventDefault();
            const resp = document.getElementById('respInput').value.trim().toUpperCase();
            const proc = document.getElementById('procInput').value.trim().toUpperCase();
            if (resp && proc) {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'tareas'), {
                    encargado: resp,
                    proceso: proc,
                    status: 'Pendiente',
                    createdAt: new Date().toISOString()
                });
                document.getElementById('procInput').value = '';
                // Mantenemos el responsable para carga rápida
            }
        };

        document.getElementById('searchBar').oninput = renderTasks;

        // Iniciar
        init();
        lucide.createIcons();
    </script>
</body>
</html>
