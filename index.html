<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SISTEMA DE STATUS - CONTROL DE PROCESOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .status-badge { transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-24">

    <div id="app">
        <!-- Barra de Navegación -->
        <header class="bg-white/90 backdrop-blur-md border-b sticky top-0 z-40 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div class="flex items-center gap-4">
                    <div class="bg-blue-600 p-2.5 rounded-2xl text-white shadow-lg shadow-blue-200">
                        <i data-lucide="layout-dashboard" size="26"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-black text-slate-900 tracking-tighter uppercase">Status de Pendientes</h1>
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                            <p class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Sincronización en Tiempo Real</p>
                        </div>
                    </div>
                </div>
                
                <div class="flex items-center gap-3">
                    <div class="relative flex-1 md:w-80">
                        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400" size="16"></i>
                        <input 
                            type="text" 
                            id="searchBar"
                            placeholder="BUSCAR TAREA O RESPONSABLE..."
                            class="w-full pl-11 pr-4 py-3 bg-slate-100 border-none rounded-2xl text-xs font-bold focus:ring-2 focus:ring-blue-500 transition-all uppercase placeholder:text-slate-400"
                        >
                    </div>
                    <button 
                        id="toggleAddBtn"
                        class="p-3 bg-slate-900 text-white rounded-2xl transition-all shadow-lg hover:scale-105 active:scale-95"
                    >
                        <i data-lucide="plus" id="addIcon" size="24"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 mt-8">
            <!-- Indicadores Rápidos -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                    <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Total</p>
                    <p id="totalCount" class="text-2xl font-black text-slate-800">0</p>
                </div>
                <div class="bg-yellow-50 p-6 rounded-3xl border border-yellow-100 shadow-sm">
                    <p class="text-[10px] font-black text-yellow-600 uppercase tracking-widest mb-1">Pendientes</p>
                    <p id="pendingCount" class="text-2xl font-black text-yellow-700">0</p>
                </div>
                <div class="bg-blue-50 p-6 rounded-3xl border border-blue-100 shadow-sm">
                    <p class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-1">En Proceso</p>
                    <p id="processCount" class="text-2xl font-black text-blue-700">0</p>
                </div>
                <div class="bg-green-50 p-6 rounded-3xl border border-green-100 shadow-sm">
                    <p class="text-[10px] font-black text-green-600 uppercase tracking-widest mb-1">Completados</p>
                    <p id="completedCount" class="text-2xl font-black text-green-700">0</p>
                </div>
            </div>

            <!-- Formulario para agregar procesos -->
            <div id="addFormContainer" class="hidden bg-white rounded-[2.5rem] p-8 shadow-2xl border border-slate-100 mb-10 animate-in slide-in-from-top-6 duration-500">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xs font-black uppercase tracking-[0.2em] text-blue-600">Registrar Nuevo Proceso</h2>
                </div>
                <form id="taskForm" class="space-y-6">
                    <div class="grid md:grid-cols-12 gap-6">
                        <div class="md:col-span-4 space-y-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Responsable</label>
                            <input 
                                type="text" 
                                id="respInput"
                                list="responsables-sugeridos"
                                placeholder="EJ: BUK, HONDA, ABRAHAM..."
                                class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-xs font-bold uppercase outline-none focus:border-blue-500 transition-all"
                                required
                            >
                            <datalist id="responsables-sugeridos">
                                <option value="BUK">
                                <option value="HONDA">
                                <option value="ABRAHAM">
                                <option value="KATJUSKA">
                            </datalist>
                        </div>
                        <div class="md:col-span-8 space-y-2">
                            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1">Descripción del Pendiente</label>
                            <div class="flex gap-3">
                                <input 
                                    type="text" 
                                    id="procInput"
                                    placeholder="INGRESE LA TAREA..."
                                    class="flex-1 p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl text-xs font-bold uppercase outline-none focus:border-blue-500 transition-all"
                                    required
                                >
                                <button type="submit" class="bg-blue-600 text-white px-8 rounded-2xl font-black text-xs uppercase hover:bg-blue-700 shadow-lg shadow-blue-100 transition-all flex items-center gap-2">
                                    <i data-lucide="save" size="16"></i> GUARDAR
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Filtros de Responsables -->
            <div id="filterContainer" class="flex items-center gap-3 mb-8 overflow-x-auto pb-4 scrollbar-hide">
                <!-- Se genera dinámicamente -->
            </div>

            <!-- Tabla de Procesos -->
            <div class="bg-white rounded-[2.5rem] shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full border-collapse">
                        <thead>
                            <tr class="bg-slate-50/50 border-b border-slate-100">
                                <th class="px-8 py-6 text-[10px] font-black text-slate-400 uppercase tracking-widest text-left">Responsable</th>
                                <th class="px-8 py-6 text-[10px] font-black text-slate-400 uppercase tracking-widest text-left">Proceso / Tarea</th>
                                <th class="px-8 py-6 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Estado</th>
                                <th class="px-8 py-6"></th>
                            </tr>
                        </thead>
                        <tbody id="taskTableBody" class="divide-y divide-slate-50">
                            <!-- Se genera dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- Modal Anexo 1 -->
        <div id="anexoModal" class="fixed inset-0 bg-black/70 z-50 hidden flex items-center justify-center p-4 backdrop-blur-md transition-all">
            <div class="bg-white rounded-[2rem] w-full max-w-5xl shadow-2xl overflow-hidden border border-slate-200 animate-in zoom-in-95 duration-300">
                <div class="bg-slate-900 p-6 text-white flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <i data-lucide="file-spreadsheet" size="24" class="text-blue-400"></i>
                        <h3 class="font-black tracking-tight uppercase">Anexo 1: Validación de Fechas de Ingreso</h3>
                    </div>
                    <button onclick="document.getElementById('anexoModal').classList.add('hidden')" class="hover:bg-white/10 p-2 rounded-full transition-colors">
                        <i data-lucide="x"></i>
                    </button>
                </div>
                <div class="p-8 overflow-x-auto" id="anexoContent">
                    <!-- Tabla del anexo inyectada por JS -->
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="fixed bottom-0 left-0 right-0 bg-white/80 backdrop-blur-md border-t py-4 z-40">
            <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
                <p class="text-[10px] font-black text-slate-400 tracking-[0.2em] uppercase">Control de Gestión Equipo © 2025</p>
                <div id="syncStatus" class="flex items-center gap-2">
                    <span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span>
                    <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Conectado</span>
                </div>
            </div>
        </footer>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'status-tracker-pro';

        let currentTasks = [];
        let filterActive = 'Todos';

        // DATOS DEL ANEXO 1
        const ANEXO_1_DATA = [
            { empresa: "HDP", numero: "71395089", nombre: "ACOSTA DLOAYZA NICOLAS", reporte: "2021-12-17", buk: "2021-12-15" },
            { empresa: "HSP", numero: "5365524", nombre: "DIAZ FLORES ENRIQUE", reporte: "2011-10-01", buk: "2002-12-17" },
            { empresa: "HSP", numero: "43014238", nombre: "INFANZON GARCIA HERNAN LUIS", reporte: "2010-05-01", buk: "2009-12-14" },
            { empresa: "HSP", numero: "7751221", nombre: "RENGIFO QUISPE CARLOS MARCOS", reporte: "2010-05-01", buk: "1991-11-18" },
            { empresa: "HSP", numero: "44849303", nombre: "TUESTA TORRES WILSON JUNIOR", reporte: "2014-01-01", buk: "2009-03-02" }
        ];

        // DATOS INICIALES DEL EXCEL
        const INITIAL_SEED = [
            { encargado: 'BUK', proceso: 'INDEMNIZACIÓN DE VACACIONES. BK ESPEJO' },
            { encargado: 'BUK', proceso: 'BLOQUEO DE VACACIONES.' },
            { encargado: 'BUK', proceso: 'PROBAR TXT PAGO.' },
            { encargado: 'BUK', proceso: 'ENSEÑAR COMO SE REGISTRA LOS PRESTAMOS' },
            { encargado: 'HONDA', proceso: 'HISTORICO DE FALTAS (PARA PROCESO DE LIQUIDACIONES)' },
            { encargado: 'HONDA', proceso: 'ACTUALIZACIÓN DE LOS DATOS AFP (PLATAFORMA AFP NET)' },
            { encargado: 'HONDA', proceso: 'SOLICITAR LOS DOCUMENTOS DE RETENCION JUDICIAL' },
            { encargado: 'ABRAHAM', proceso: 'EL CLIENTE NOS CONFIRMÓ CAMBIAR DE FECHAS DE INGRESO (VALIDAR FECHA DE INGRESO) ANEXO 1' },
            { encargado: 'ABRAHAM', proceso: 'INGRESAR NOVEDADES DICIEMBRE (ADEMÁS VALIDAR LOS % DE APORTE)' },
            { encargado: 'KATJUSKA', proceso: 'VALIDAR GRATIFICACIONES DICIEMBRE (CÁLCULO, PRESTAMOS, DESCUENTO, ETC)' },
            { encargado: 'KATJUSKA', proceso: 'RECORDATORIO INDICANDO QUE ESTÁ PENDIENTE LA ACTUALIZACIÓN DE LOS DATOS AFP' }
        ];

        async function startApp() {
            // Autenticación primero
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'tareas');
                    onSnapshot(colRef, (snapshot) => {
                        const tasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        if (tasks.length === 0) {
                            seedData();
                        } else {
                            currentTasks = tasks.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
                            render();
                        }
                    }, (err) => console.error("Error Firestore:", err));
                }
            });
        }

        async function seedData() {
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'tareas');
            for (const item of INITIAL_SEED) {
                await addDoc(colRef, {
                    encargado: item.encargado.toUpperCase(),
                    proceso: item.proceso.toUpperCase(),
                    status: 'Pendiente',
                    createdAt: new Date().toISOString()
                });
            }
        }

        function render() {
            renderFilters();
            renderTable();
            updateStats();
            lucide.createIcons();
        }

        function renderFilters() {
            const container = document.getElementById('filterContainer');
            const responsables = ['Todos', ...new Set(currentTasks.map(t => t.encargado))].sort();
            
            container.innerHTML = `<div class="flex items-center gap-2 text-slate-400 mr-2 border-r pr-4 border-slate-200 shrink-0">
                <i data-lucide="filter" size="14"></i><span class="text-[9px] font-black uppercase tracking-widest">Filtrar:</span>
            </div>`;

            responsables.forEach(r => {
                const btn = document.createElement('button');
                btn.className = `px-5 py-2.5 rounded-2xl text-[10px] font-black tracking-widest transition-all shrink-0 border-2 ${filterActive === r ? 'bg-slate-900 border-slate-900 text-white shadow-lg' : 'bg-white border-slate-100 text-slate-400 hover:border-slate-300'}`;
                btn.innerText = r.toUpperCase();
                btn.onclick = () => { filterActive = r; render(); };
                container.appendChild(btn);
            });
        }

        function renderTable() {
            const body = document.getElementById('taskTableBody');
            const search = document.getElementById('searchBar').value.toUpperCase();
            
            const filtered = currentTasks.filter(t => {
                const matchesFilter = filterActive === 'Todos' || t.encargado === filterActive;
                const matchesSearch = t.proceso.includes(search) || t.encargado.includes(search);
                return matchesFilter && matchesSearch;
            });

            body.innerHTML = filtered.map(t => `
                <tr class="hover:bg-slate-50 group transition-colors">
                    <td class="px-8 py-6">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-xl bg-slate-100 flex items-center justify-center text-slate-400 group-hover:bg-blue-600 group-hover:text-white transition-all">
                                <i data-lucide="user" size="14"></i>
                            </div>
                            <span class="font-black text-slate-800 text-xs tracking-tight">${t.encargado}</span>
                        </div>
                    </td>
                    <td class="px-8 py-6">
                        <div class="space-y-2">
                            <p class="text-xs font-bold text-slate-600 uppercase leading-relaxed max-w-2xl">${t.proceso}</p>
                            ${t.proceso.includes('ANEXO 1') ? `
                                <button onclick="window.showAnexo()" class="flex items-center gap-2 text-[9px] font-black text-blue-600 bg-blue-50 px-3 py-1.5 rounded-xl border border-blue-100 hover:bg-blue-600 hover:text-white transition-all w-fit uppercase">
                                    <i data-lucide="file-text" size="12"></i> Ver Tabla Validación
                                </button>
                            ` : ''}
                        </div>
                    </td>
                    <td class="px-8 py-6">
                        <div class="flex justify-center relative group/menu">
                            <button class="px-4 py-2 rounded-2xl text-[10px] font-black border-2 transition-all shadow-sm ${getStatusClass(t.status)}">
                                ${t.status.toUpperCase()}
                            </button>
                            <div class="absolute left-1/2 -translate-x-1/2 mt-2 hidden group-hover/menu:block z-30 bg-white border border-slate-200 rounded-2xl shadow-2xl p-2 min-w-[140px]">
                                ${['Pendiente', 'En Proceso', 'Completado'].map(st => `
                                    <button onclick="window.updateTaskStatus('${t.id}', '${st}')" class="w-full text-left px-4 py-2.5 text-[10px] hover:bg-slate-50 rounded-xl font-black uppercase text-slate-500 hover:text-blue-600 transition-colors">${st}</button>
                                `).join('')}
                            </div>
                        </div>
                    </td>
                    <td class="px-8 py-6 text-right">
                        <button onclick="window.deleteTask('${t.id}')" class="p-2 text-slate-200 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-all rounded-lg hover:bg-red-50">
                            <i data-lucide="trash-2" size="18"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function updateStats() {
            const total = currentTasks.length;
            const pending = currentTasks.filter(t => t.status === 'Pendiente').length;
            const process = currentTasks.filter(t => t.status === 'En Proceso').length;
            const completed = currentTasks.filter(t => t.status === 'Completado').length;

            document.getElementById('totalCount').innerText = total;
            document.getElementById('pendingCount').innerText = pending;
            document.getElementById('processCount').innerText = process;
            document.getElementById('completedCount').innerText = completed;
        }

        function getStatusClass(s) {
            if (s === 'Pendiente') return 'bg-yellow-50 text-yellow-700 border-yellow-200';
            if (s === 'En Proceso') return 'bg-blue-50 text-blue-700 border-blue-200';
            return 'bg-green-50 text-green-700 border-green-200';
        }

        // ACCIONES GLOBALES
        window.updateTaskStatus = async (id, status) => {
            const ref = doc(db, 'artifacts', appId, 'public', 'data', 'tareas', id);
            await updateDoc(ref, { status });
        };

        window.deleteTask = async (id) => {
            if (confirm("¿ELIMINAR ESTE PROCESO PARA TODO EL EQUIPO?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'tareas', id));
            }
        };

        window.showAnexo = () => {
            const modal = document.getElementById('anexoModal');
            const content = document.getElementById('anexoContent');
            content.innerHTML = `
                <table class="w-full text-xs">
                    <thead>
                        <tr class="border-b-2 border-slate-100 text-slate-400 font-black uppercase tracking-widest">
                            <th class="px-4 py-4 text-left">Empresa</th>
                            <th class="px-4 py-4 text-left">Número</th>
                            <th class="px-4 py-4 text-left">Nombre Completo</th>
                            <th class="px-4 py-4 text-left text-blue-600 bg-blue-50/50">Reporte 31/10</th>
                            <th class="px-4 py-4 text-left text-green-600 bg-green-50/50">Fecha BUK</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-50">
                        ${ANEXO_1_DATA.map(r => `
                            <tr>
                                <td class="px-4 py-4 font-black">${r.empresa}</td>
                                <td class="px-4 py-4 text-slate-500 font-bold">${r.numero}</td>
                                <td class="px-4 py-4 font-black uppercase">${r.nombre}</td>
                                <td class="px-4 py-4 text-blue-700 bg-blue-50/20 font-black">${r.reporte}</td>
                                <td class="px-4 py-4 text-green-700 bg-green-50/20 font-black">${r.buk}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;
            modal.classList.remove('hidden');
            lucide.createIcons();
        };

        // EVENTOS UI
        document.getElementById('toggleAddBtn').onclick = () => {
            const container = document.getElementById('addFormContainer');
            const isHidden = container.classList.contains('hidden');
            container.classList.toggle('hidden');
            document.getElementById('addIcon').setAttribute('data-lucide', isHidden ? 'x' : 'plus');
            lucide.createIcons();
        };

        document.getElementById('taskForm').onsubmit = async (e) => {
            e.preventDefault();
            const resp = document.getElementById('respInput').value.trim().toUpperCase();
            const proc = document.getElementById('procInput').value.trim().toUpperCase();
            if (resp && proc) {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'tareas'), {
                    encargado: resp,
                    proceso: proc,
                    status: 'Pendiente',
                    createdAt: new Date().toISOString()
                });
                document.getElementById('procInput').value = '';
                // Mantenemos el responsable para facilitar la carga múltiple
            }
        };

        document.getElementById('searchBar').oninput = render;

        // INICIO
        startApp();
        lucide.createIcons();
    </script>
</body>
</html>
